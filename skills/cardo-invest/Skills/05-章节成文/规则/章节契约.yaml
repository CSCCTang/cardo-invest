# =============================================================================
# 章节契约 v2（T18；已合并 T17 模板逐章要求 + Lead 裁定）
#
# 版本：version 2 / schema cardo/invest-chapter-contract/v2
# 与 v1 的关系：v1 字段全部保留（source/units/gates/globalAssertions/promptRules/
#   byDirection），v2 只做新增，不改老字段语义。
#
# 覆盖口径（验收硬门槛）：
#   模板 45 个 H2/H3/H4 标题 100% 覆盖（26 H2 + 12 H3 + 7 H4），文案逐字一致；
#   另保留 2 个合成节（CH-03-01、CH-10-01）作取料/来源锚点，renderHeading: false，
#   **不生成标题**（Lead D-01），内容并入章正文。合计 47 个 section 节点。
#
# Lead 裁定落地（T17 §6 差异项）：
#   D-01 成品只渲染 45 个模板标题；CH-03-01/CH-10-01 不渲染标题 → renderHeading: false
#   D-02 promptRule R-15 改挂 CH-05-02（模板段落 56 实为 5.2）；CH-04-04 另补取料规则
#        （见 supplementalRules，S-01；promptRules 仍为 34 条，保证 v1 断言不回归）
#   D-03/D-07/D-08 旧口径一律以 财务口径.yaml + 引擎 JSON 为准：计算期 33 年、
#        土地使用税 8 元/㎡、租赁增值税 11% 仅作旧口径差异说明；正文禁抄模板旧值
#   D-05 8.1.4.3 标题逐字照模板（含括号说明），不剥离不简化
#   D-11 敏感性分析放 8.3 正文（表 8-8 + 图 8-2），不新增 8.3.1 标题，45 标题不变
#   D-12 表格就地放置：表位 1/2 置于 8.1.5.1 之后（表 8-9/8-10）；表位 3–6 置于
#        9.2.1/9.2.2 就地（表 9-3…9-6），不再统一放章末；编号随出现顺序
#        （注：Lead 表述为“表位 3–6 放 9.2.4.2 之后”，与 T17 表图清单的就地位置冲突，
#         按“表图清单以 T17 为准”落在 9.2.1/9.2.2；如需改到 9.2.4.2 之后，只需改
#         tablesIndex.section 与编号，编号规则不变）
#
# 字数口径（v2 定稿）：wordMin = 该节**自身正文**中文字符数（不含下级小节、
#   不含表格/来源行/标题）。章 wordMin = 全部小节 wordMin 之和 = T17 下限，
#   合计 21,400 字（v2 门槛 20,000 为底线）。
#
# 版本 +1 回归影响（详见 docs/handoff/v2-T18.md）：
#   1) check_report_v2.py 按 v2 校验（新增入口，不影响 v1）；
#   2) check_invest.py 的 CONTRACT-VERSION 断言同步兼容 version>=2（其余 39 项校验不变）；
#   3) 章节 skill / compose / render 读契约时按 v2 字段取要求，v1 字段继续可用。
# =============================================================================
schema: cardo/invest-chapter-contract/v2
version: 2
extractedAt: "2026-10-22"
updatedAt: "2026-10-23"
producer: cardo-invest-spec/T3+T18
source:
  templateAsset: skills/cardo-invest-spec/assets/templates/2 城市更新老旧街区改造项目投资决策建议书（模板）-补充数据来源（包含三类项目）.docx
  templateSha256: f8f97d8bcd317007d2d76e1871f319797fe7b8e297ee7a48365bb5dfafce7b10
  originalSha256: 395b0a47ab448eac21c1c52cdbe7014db24e68b22c001c34eb6839e2751d026a
  originalChapters: 10
  originalHeadingCensus: 55 个标题 = H1×10 + H2×26 + H3×12 + H4×7
  chapterRequirements: docs/模板逐章要求.md
  chapterSkillConvention: docs/章节skill约定.md
  note: 模板正文 34 处“数据来源”字样（28 标准 + 6 非标准）已全部转为 promptRules；成品 0 残留由全局断言保证
units:
  chapterCount: 10
  tableSlotCount: 6
  promptLineCount: 34
  templateHeadingCount: 45
  sectionNodeCount: 47
  syntheticSectionCount: 2
  tableIndexCount: 42
  mandatoryTableCount: 35
  optionalTableCount: 7
  figureIndexCount: 12
  mandatoryFigureCount: 8
  conditionalFigureCount: 3
  tableCountMin: 20
  figureCountMin: 6
