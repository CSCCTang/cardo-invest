# ---------------------------------------------------------------- 11. 段落模板（写作原语对应）
paragraphTemplates:
  conclusionSection: [结论句（含数字/事实）, 依据（1-2 句，展开数字或机制）, 影响/建议（1 句）]
  analysisSection: [判断, 证据（数字/事实/对比）, 机制或归因, 对本项目的影响]
  dataSection: [口径说明, 数据与结构, 关键变化或占比, 判断]
  problemSection: [问题现象, 量化证据, 影响对象与程度, 对应改造方向]
  recommendationSection: [结论, 理由（分点）, 前置条件与风险, 下一步动作]
  sourceRule: 每个段落后面都要跟一行“来源：…”

# ---------------------------------------------------------------- 12. 自检目录（与 章节契约.yaml#acceptanceCatalog、T17 §8 对齐）
checks:
  - id: A-01
    desc: 45 标题覆盖（编号+文案逐字一致，缺失/改字=0）
    level: fail
  - id: A-02
    desc: 字数——每章 ≥ 契约 wordMin；全书 ≥21,400（门槛 20,000）
    level: fail
  - id: A-03
    desc: 节字数——每节 ≥ 契约 wordMin（本节自身正文）
    level: fail
  - id: A-04
    desc: 表数量——表位 1–6 齐全 + 必备表 35 张齐全；全书 ≥20
    level: fail
  - id: A-05
    desc: 图数量——必备图 8 张齐全；全书 ≥8；每图有 labels/series/unit/source
    level: fail
  - id: A-06
    desc: 来源行——每节 ≥1 条“文件#字段”；空话来源 = 0
    level: fail
  - id: A-07
    desc: 数字一致——1.3 vs 7.1/8/9 同数；与引擎 JSON 容差内一致
    level: fail
  - id: A-08
    desc: 口径一致——计算期/折现率/税率/单位/小数位跨章一致；税前税后标注齐全
    level: fail
  - id: A-09
    desc: 财务完整性——10 项指标；敏感性 ≥3 因素；ICR/DSCR 注明聚合口径
    level: fail
  - id: A-10
    desc: AHP 完整性——16 指标；表位 3/4 正互反；表位 5/6 权重和=1；CR 有值或标注临时
    level: fail
  - id: A-11
    desc: 模板旧值 0 命中（32年/运营期29年/后19年/11%/4.5元/㎡），或同段标注旧口径
    level: fail
  - id: A-12
    desc: 未选方向话术 0 命中（适用性声明除外）
    level: fail
  - id: A-13
    desc: 占位符/“待补” 0 残留
    level: fail
  - id: A-14
    desc: 表头——表位 1–6 列名与表格契约一致；表位 2 写“资本金”
    level: fail
  - id: A-15
    desc: 断链——正文引用的表/图/附件均存在
    level: warn