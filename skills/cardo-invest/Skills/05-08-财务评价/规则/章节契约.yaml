        - Q2：年折旧额多少，折旧对现金流的影响（非付现成本）怎么解释
        - Q3：是否有无形资产或递延资产摊销（通常不涉及），若涉及年限多少
        paragraphPlan:
        - P1 年折旧结论
        - P2 折旧假设与计算
        - P3 摊销说明（不涉及也要写明）
        requiredTables: []
        optionalTables:
