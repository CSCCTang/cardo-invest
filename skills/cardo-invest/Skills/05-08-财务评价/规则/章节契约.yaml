    - id: CH-08-01-03
      number: 8.1.3
      title: 经营收入分析
      level: 3
      required: true
      templateHeading: true
      renderHeading: true
      templateHeadingText: 经营收入分析
      goal: 逐项给数量、单价、首年与运营期收入、占比与依据，与 4.4/5.3 同数
      audience:
      - 评审
      - 城投
      wordMin: 650
      requiredQuestions:
      - Q1：有哪几类收入项，每项测算公式（数量×单价×天数×出租率）是什么
      - Q2：每项首年收入、运营期合计、占收入比各多少
      - Q3：单价与增长率依据是什么（政府定价/市场调研/合同）
      - Q4：收入假设与 4.4 是否一致
      - Q5：未选用的收入项为什么不选（方向/条件限制）
      - Q6：出租率或增长率变动对收入影响多大
      paragraphPlan:
      - P1 结论：年运营收入 X 万元，结构为…
      - P2 逐项说明（按项目选用的收入项，每项 2–3 句）
      - P3 收入结构与假设说明（含未选项目说明）
      requiredTables:
      - T8-2
      optionalTables: []
      requiredFigures: []
      acceptance:
      - ACC-WORD
      - ACC-KEYQ
      - ACC-TABLE
      - ACC-SOURCE
      - ACC-NUM
      source:
        kind: computed
        from: 财务测算.json#revenue
        missing: gap
