  wordTotalFloor: 20000
gates:
  chapterScope: G-invest-2
  promptLinePolicy: 提示行只作为取料规则，绝不出现在成品
  writingScope: G-invest-7
  writingPolicy: 语气/术语/禁用词/来源行/块级语法/题注只在 写作规范.yaml 定义，本契约只引用不复制

# ---------------------------------------------------------------- 写作配套
writingProfile:
  rulesFile: 写作规范.yaml
  writingLib: scripts/writing.py
  checker: scripts/check_report_v2.py
  fragmentFormat: markdown + 块级 HTML 注释语法
  fragmentPath: 05_过程/投资决策/分章/CH-XX.md
  blockSyntaxRef: 写作规范.yaml#blockSyntax
  contractRef: skills/cardo-invest-spec/规则/章节契约.yaml
  chapterHeadingPolicy: 分章稿不写 H1（compose 生成）；小节标题 ##/###/#### + 编号 + 模板标题逐字
  numbering:
    table: 表 <章>-<章内出现序号>
    figure: 图 <章>-<章内出现序号>
    rule: 编号按成品出现顺序连续；章内不跳号、不重号
  wordMinSemantics: wordMin = 该节自身正文中文字符数（不含下级小节/表格/来源行/标题）；章 wordMin = 各节之和
  paragraphPlanSemantics: paragraphPlan 是有序段落意图清单，不是逐段模板；顺序可变通，段数不得少于 length-1
  requiredQuestionsSemantics: 必答问题必须在小节正文里被明确回答；允许换句式，不允许漏答；答不出写（资料缺失：…）
  acceptanceSemantics: acceptance 里的 id 指向 acceptanceCatalog；fail 级不过则该小节判 fail
  optionalSemantics: optionalTables/optionalFigures 为材料充足时升级的选做项，不计入门槛
  dataPolicy: 数字只读上游引擎 JSON；章节脚本禁止自行计算财务指标（财务口径.yaml 为唯一口径）
  wordCountPolicy: count_cn_words() 统计中文汉字，去标题/表格/来源行/图块；实现见 scripts/writing.py

# ---------------------------------------------------------------- 验收目录
acceptanceCatalog:
  - id: ACC-STRUCT
    desc: 小节标题存在，层级与文案与契约逐字一致（45 个模板标题全覆盖；合成节不渲染）
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-WORD
    desc: 小节自身正文中文字符数 ≥ 该小节 wordMin；章合计 ≥ 该章 wordMin
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-KEYQ
    desc: 小节 requiredQuestions 全部被正文明确回答（领域关键词命中，非逐字）
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-PARAS
    desc: 段落数 ≥ paragraphPlan 长度-1，且单段 ≤ 300 字
    severity: warn
    impl: check_report_v2.py --book
  - id: ACC-TABLE
    desc: requiredTables 全部出现；表头列数与 tablesIndex 一致；编号按出现顺序连续
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-SLOT
    desc: 表格契约表位 1–6 齐全（表 8-9/8-10、表 9-3…9-6）
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-FIGURE
    desc: requiredFigures 全部出现；图块含 id/type/caption/source 与 labels/series/unit
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-SOURCE
    desc: 每节至少 1 条“来源：”行，每个数据段有来源；空话来源 = 0
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-NUM
    desc: 跨章同一指标数字一致（容差按表格契约）；有 --upstream 时与引擎 JSON 对账
    severity: fail
    impl: check_report_v2.py --book --upstream
  - id: ACC-TERM
    desc: 术语/缩写/单位/小数位/税前税后标注符合 写作规范.yaml
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-NOBAN
    desc: 禁用词 0 命中（项目资料/待补/据测算无依据/网络资料未具名/自行整理/参考市场等）
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-CAPTION
    desc: 表图 id/caption/source 齐全，题注与索引一致，编号连续
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-STALE
    desc: 模板旧值 0 命中（32年/运营期29年/后19年/11%/4.5元/㎡），或同段标注旧口径
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-DIRECTION
    desc: 非本项目方向的模板话术 0 命中（适用性声明除外）
    severity: fail
    impl: check_report_v2.py --book
  - id: ACC-MISSING
    desc: 缺项用“（资料缺失：…，见缺项表）”表述，同步缺项表
    severity: warn
    impl: check_report_v2.py --book

