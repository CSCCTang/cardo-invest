        templateHeading: true
        renderHeading: true
        templateHeadingText: 经营成本
        goal: 五项成本逐项给基数与费率、年金额与占收入比，人员与修理费假设可核
        audience:
        - 评审
        wordMin: 280
        requiredQuestions:
        - Q1：经营成本有哪几项，各自计算方法（费率/定额/人数）是什么
        - Q2：年经营成本多少、占收入比多少
        - Q3：人员配置与薪酬假设是什么（定员/人均年薪/福利/增长率）
        - Q4：修理费与大修费的年限分段假设是否与运营期匹配
        paragraphPlan:
        - P1 结论：年经营成本 X 万元、占收入 Y%
        - P2 外购燃料动力 + 工资福利
        - P3 管理费 + 日常修理费 + 其他费用
        - P4 大修费与年限假设
        requiredTables:
