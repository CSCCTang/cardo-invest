  - ACC-DIRECTION
  antiPatterns:
  - 空话：只有架构图不写职责
  - 一致：实施主体与 1.1 不一致
  - 缺失：不写人员与人力成本，导致 8 章工资福利无依据
  - 越位：让城投代替政府审批（合规硬伤）
  - 编造：槽位缺失仍编组织名称
  sections:
