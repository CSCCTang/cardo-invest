writingProfile:
  rulesFile: 写作规范.yaml
  writingLib: scripts/writing.py
  checker: scripts/check_report_v2.py
  fragmentFormat: markdown + 块级 HTML 注释语法
  fragmentPath: 05_过程/投资决策/分章/CH-XX.md
  blockSyntaxRef: 写作规范.yaml#blockSyntax
  contractRef: skills/cardo-invest-spec/规则/章节契约.yaml
  chapterHeadingPolicy: 分章稿不写 H1（compose 生成）；小节标题
  numbering:
    table: 表 <章>-<章内出现序号>
    figure: 图 <章>-<章内出现序号>
    rule: 编号按成品出现顺序连续；章内不跳号、不重号
  wordMinSemantics: wordMin = 该节自身正文中文字符数（不含下级小节/表格/来源行/标题）；章 wordMin = 各节之和
  paragraphPlanSemantics: paragraphPlan 是有序段落意图清单，不是逐段模板；顺序可变通，段数不得少于 length-1
  requiredQuestionsSemantics: 必答问题必须在小节正文里被明确回答；允许换句式，不允许漏答；答不出写（资料缺失：…）
  acceptanceSemantics: acceptance 里的 id 指向 acceptanceCatalog；fail 级不过则该小节判 fail
  optionalSemantics: optionalTables/optionalFigures 为材料充足时升级的选做项，不计入门槛
  dataPolicy: 数字只读上游引擎 JSON；章节脚本禁止自行计算财务指标（财务口径.yaml 为唯一口径）
  wordCountPolicy: count_cn_words() 统计中文汉字，去标题/表格/来源行/图块；实现见 scripts/writing.py
globalAssertions:
- id: CHK-INV-1
  desc: 一级标题数量=10 且顺序与契约 chapters 一致
  severity: fail
- id: CHK-INV-2
  desc: 表位 1–6 齐全且表头与表格契约一致
  severity: fail
- id: CHK-INV-3
  desc: 成品不含“数据来源”提示行（0 残留），且契约 34 条 promptRules 每条已映射到 section
  severity: fail
- id: CHK-INV-4
  desc: 成品不含占位符（双花括号/待补/TODO/XXX）
  severity: fail
- id: CHK-INV-5
  desc: 成品与插件资产不含真实项目名（项目级扫描 0 命中）
  severity: fail
- id: CHK-INV-6
  desc: 成品与插件文本不含盘符/UNC/用户目录绝对路径
  severity: fail
- id: CHK-INV-7
  desc: 表位 1/2 指标数字/行名/单位与 财务测算.json 一致（成品展示容差 0.04pp/0.01 万元/0.01 年；锚点容差 0.5%/1 万元另见财务口径）
  severity: fail
- id: CHK-INV-8
  desc: 每章有来源映射（sourceMap，≥10 章），断链 0（实现按 fail 校验，严于本 warn 级）
  severity: warn
