  - id: CH-06-02
    number: '6.2'
    title: 长效运营收益模式
    level: 2
    required: true
    templateHeading: true
    renderHeading: true
    templateHeadingText: 长效运营收益模式
    goal: 三重收益结构带金额与占比，收支平衡点可算，退出路径给前置条件
    audience:
    - 城投
    - 评审
    wordMin: 700
    requiredQuestions:
    - Q1：运营模式是什么（自主/委托/合作/租赁），为什么选它
    - Q2：收益有哪几类、各多少（与 8.1.3 同数）
    - Q3：运营成本与收支平衡点（运营成本占收入比）是多少
    - Q4：长期资产增值或退出路径是否现实，前置条件是什么
    - Q5：运营风险（招商不及预期、租金下行、客流不足）与对策
    paragraphPlan:
    - P1 结论：公益性兜底 + 市场化造血 + 资产增值三重收益
    - P2 运营模式选择
    - P3 收益结构（3 类，带金额与占比）
    - P4 收支平衡与现金流可持续
    - P5 退出路径与风险对策
    requiredTables:
    - T6-2
    optionalTables: []
    requiredFigures: []
    acceptance:
    - ACC-WORD
    - ACC-KEYQ
    - ACC-TABLE
    - ACC-SOURCE
    - ACC-NUM
    - ACC-DIRECTION
    source:
      kind: project_file_or_web
      from:
      - 类似项目参考资料
      - 网络类似案例
      missing: gap
