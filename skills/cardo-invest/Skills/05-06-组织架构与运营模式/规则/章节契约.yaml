    number: '6.1'
    title: 组织实施架构
    level: 2
    required: true
    templateHeading: true
    renderHeading: true
    templateHeadingText: 组织实施架构
    goal: 五方架构 + 职责边界 + 人员配置 + 协同机制，配表 6-1 与图 6-1
    audience:
    - 城投
    - 政府
    wordMin: 800
    requiredQuestions:
    - Q1：谁决策、谁实施、谁运营、谁监管，四方职责边界怎么切
    - Q2：是否设立项目公司，股权结构、治理机制如何
    - Q3：人员配置与关键岗位是什么（自有或外包各多少人）
    - Q4：与政府、社区、居民的协同机制是什么
    - Q5：实施主体的能力与资质是否匹配（工程/运营/融资）
    paragraphPlan:
    - P1 架构结论（政府监管—城投实施—项目公司运作—专业运营—社区参与）
    - P2 政府主管部门职责
    - P3 实施主体与项目公司
    - P4 运营团队或第三方商管
    - P5 协同机制与能力匹配
    requiredTables:
