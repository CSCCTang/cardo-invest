  - P1 结论：调研覆盖 X，现状总体为…，核心问题 N 项（约 200 字）
  - P2 调研方法与范围（无人机/问卷/踏勘、时间、样本）
  - P3 现状指标（6–8 个关键指标，每个数值+口径+来源，约 600 字）
  - P4 问题优先级（安全→功能→品质→业态，约 400 字）
  - P5 对后续章节的输入清单（→4.2/5.1/5.3，约 300 字）
  - P6 局限与建议补测（约 200 字）
