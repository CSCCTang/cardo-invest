  - 评审
  - 内部
  wordMin: 1900
  templateParagraphs:
  - 36
  - 37
  - 38
  requiredQuestions:
  - Q1：现状调研的范围、时间、方法与样本量是什么
  - Q2：空间/建筑/人口/业态/交通/市政/公共服务/生态 8 类现状的核心指标各是多少
  - Q3：主要问题（与 2.3 同一套）及优先级如何
  - Q4：哪些结论直接支撑 5.1 范围界定、4.2 功能定位、5.3 改造内容
  - Q5：调研的局限是什么（模型精度、样本偏差、覆盖缺口、时点）
