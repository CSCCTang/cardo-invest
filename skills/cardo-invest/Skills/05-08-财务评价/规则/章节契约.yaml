    children:
    - id: CH-08-01-01
      number: 8.1.1
      title: 评价说明
      level: 3
      required: true
      templateHeading: true
      renderHeading: true
      templateHeadingText: 评价说明
      goal: 依据、范围与口径、计算期与折现率、价格体系四件事说清
      audience:
      - 评审
      wordMin: 200
      requiredQuestions:
      - Q1：评价依据是什么（《建设项目经济评价方法与参数》第三版 + 国家财税政策 + 口径版本）
      - Q2：评价范围与口径是什么（税后；全部投资 + 资本金两套）
      - Q3：计算期与折现率是多少
      - Q4：价格体系是什么（不含税收入、是否考虑涨价）
      paragraphPlan:
      - P1 依据
      - P2 口径与范围
      - P3 计算期/折现率/价格体系
      requiredTables: []
      optionalTables: []
      requiredFigures: []
      acceptance:
      - ACC-WORD
      - ACC-KEYQ
      - ACC-SOURCE
      - ACC-TERM
      source:
        kind: computed
        from: 财务口径.yaml + 财务测算.json
        missing: gap
    - id: CH-08-01-02
      number: 8.1.2
      title: 财务评价基础数据与参数
      level: 3
      required: true
      templateHeading: true
      renderHeading: true
      templateHeadingText: 财务评价基础数据与参数
      goal: 参数逐项给取值与依据，与模板默认差异显式说明（D-03/D-08）
      audience:
      - 评审
      - 内部
      wordMin: 350
      requiredQuestions:
      - Q1：计算期几年（建设期/运营期/合计）
      - Q2：基准收益率或折现率多少，依据什么
      - Q3：运营方案是什么（自主/委托）
      - Q4：关键参数：税率、折旧年限、残值率、贷款利率/期限/宽限期、修理费/大修费假设
      - Q5：与模板默认值不一致的地方是否说明（32 年、11%、4.5 元/㎡）
      paragraphPlan:
      - P1 参数结论：计算期 X 年、折现率 3.50%
      - P2 计算期
      - P3 基准收益率
      - P4 运营方案
      - P5 关键参数表 + 与模板默认差异说明
      requiredTables:
      - T8-1
      optionalTables: []
      requiredFigures: []
      acceptance:
      - ACC-WORD
      - ACC-KEYQ
      - ACC-TABLE
      - ACC-SOURCE
      - ACC-NUM
      - ACC-STALE
      source:
