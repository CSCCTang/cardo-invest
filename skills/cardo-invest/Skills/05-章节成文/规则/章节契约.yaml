# =============================================================================
# 方向差异（v1 保留 + v2 写作差异点）
# =============================================================================
byDirection:
  老旧街区项目:
    status: v1_primary
    notes:
      - v1 只跑通街区方向；厂区/小区走同一契约，差异只在参数与收入项
    writingDeltas:
      - 5.3 分项以街巷立面、市政管网、口袋公园为主
      - 第八章收入项含停车/商铺/广告/充电桩/外摆
      - 4.1/4.4、6.2 均适用
  老旧厂区项目:
    status: reserved
    notes:
      - 第五章改造内容以厂房、基础设施、管网为主
      - 第八章收入项按项目选用（可能无停车/外摆/商铺租赁）
    writingDeltas:
      - 5.3 分项以建构筑物安全治理、功能转译、厂区基础设施为主
      - 2.3 问题侧重安全隐患与产业低效
      - 4.1 市场分析按产业园区口径改写
  老旧小区项目:
    status: reserved
    notes:
      - 第九章表 4 备注：老旧小区不涉及预期内部收益率和投资回收期
      - 第八章收入项可减少（无广告/充电桩时对应段落省略）
    writingDeltas:
      - 4.1 区域市场简述不适用（模板明确），改为社区生活圈供给分析
      - 6.2 长效运营收益模式不涉及（模板明确），改为社区共有收益与维护机制
      - 9.2.4 打分时“预期内部收益率/投资回收期”两项按不适用处理并说明

