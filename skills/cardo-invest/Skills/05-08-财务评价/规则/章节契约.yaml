writingProfile:
  rulesFile: 写作规范.yaml
  writingLib: scripts/writing.py
  checker: scripts/check_report_v2.py
  fragmentFormat: markdown + 块级 HTML 注释语法
  fragmentPath: 05_过程/投资决策/分章/CH-XX.md
  blockSyntaxRef: 写作规范.yaml#blockSyntax
  contractRef: skills/cardo-invest-spec/规则/章节契约.yaml
  chapterHeadingPolicy: 分章稿不写 H1（compose 生成）；小节标题
  numbering:
    table: 表 <章>-<章内出现序号>
    figure: 图 <章>-<章内出现序号>
    rule: 编号按成品出现顺序连续；章内不跳号、不重号
  wordMinSemantics: wordMin = 该节自身正文中文字符数（不含下级小节/表格/来源行/标题）；章 wordMin = 各节之和
  paragraphPlanSemantics: paragraphPlan 是有序段落意图清单，不是逐段模板；顺序可变通，段数不得少于 length-1
  requiredQuestionsSemantics: 必答问题必须在小节正文里被明确回答；允许换句式，不允许漏答；答不出写（资料缺失：…）
  acceptanceSemantics: acceptance 里的 id 指向 acceptanceCatalog；fail 级不过则该小节判 fail
  optionalSemantics: optionalTables/optionalFigures 为材料充足时升级的选做项，不计入门槛
  dataPolicy: 数字只读上游引擎 JSON；章节脚本禁止自行计算财务指标（财务口径.yaml 为唯一口径）
  wordCountPolicy: count_cn_words() 统计中文汉字，去标题/表格/来源行/图块；实现见 scripts/writing.py
globalAssertions:
- id: CHK-INV-1
  desc: 一级标题数量=10 且顺序与契约 chapters 一致
  severity: fail
- id: CHK-INV-2
  desc: 表位 1–6 齐全且表头与表格契约一致
  severity: fail
- id: CHK-INV-3
  desc: 成品不含“数据来源”提示行（0 残留），且契约 34 条 promptRules 每条已映射到 section
  severity: fail
- id: CHK-INV-4
  desc: 成品不含占位符（双花括号/待补/TODO/XXX）
  severity: fail
- id: CHK-INV-5
  desc: 成品与插件资产不含真实项目名（项目级扫描 0 命中）
  severity: fail
- id: CHK-INV-6
  desc: 成品与插件文本不含盘符/UNC/用户目录绝对路径
  severity: fail
- id: CHK-INV-7
  desc: 表位 1/2 指标数字/行名/单位与 财务测算.json 一致（成品展示容差 0.04pp/0.01 万元/0.01 年；锚点容差 0.5%/1 万元另见财务口径）
  severity: fail
- id: CHK-INV-8
  desc: 每章有来源映射（sourceMap，≥10 章），断链 0（实现按 fail 校验，严于本 warn 级）
  severity: warn
chapters:
- id: CH-08
  number: 8
  title: 财务评价
  level: 1
  required: true
  goal: 回答“赚不赚钱、能不能还债、扛不扛得住波动”；三条铁律：数字唯一来源 财务测算.json、每指标标口径、10 项指标齐全
  audience:
  - 评审
  - 城投
  wordMin: 3800
  templateParagraphs:
  - 220
  - 221
  - 225
  - 232
  - 257
  - 285
  - 306
  - 309
  requiredQuestions:
  - Q1：10 项指标（firrAll/fnpvAll/ptAll/firrEquity/fnpvEquity/ptEquity/roe/roi/icr/dscr）齐全且与
    indicators 逐项一致吗
  - Q2：表位 1/2 表头与数值规范（表位 2 写“资本金”）吗
  - Q3：敏感性是否 ≥3 因素
  - Q4：ICR/DSCR 口径与 coverage.basis 一致（运营期聚合口径）吗
  - Q5：与 1.3 同数吗
  paragraphPlan:
  - P1 结论段（8.1）：财务可行判断 + 口径声明
  - P2 评价说明与参数（8.1.1/8.1.2）
  - P3 收入与成本（8.1.3/8.1.4）
  - P4 现金流与指标（8.1.5.1），表 8-9/8-10 就地
  - P5 效益指标（8.1.5.2）
  - P6 偿债（8.2）与可持续性 + 敏感性（8.3）
  requiredTables:
  - T8-1
  - T8-2
  - T8-3
  - T8-5
  - T8-6
  - T8-8
  - T8-9
  - T8-10
  optionalTables:
  - T8-4
  - T8-7
  requiredFigures:
  - F8-1
  - F8-2
  optionalFigures: []
  acceptance:
  - ACC-STRUCT
  - ACC-WORD
  - ACC-KEYQ
  - ACC-PARAS
  - ACC-TABLE
  - ACC-SLOT
  - ACC-FIGURE
  - ACC-SOURCE
  - ACC-NUM
  - ACC-TERM
  - ACC-NOBAN
  - ACC-CAPTION
  - ACC-STALE
  antiPatterns:
  - 口径：税前税后混用（模板 xlsx 的 J 列是税前，别对错列）
  - 一致：表位 1/2 与正文数字不一致
  - 结论：只说可行不对比 3.50% 基准
  - 编数：敏感性数据自算、与引擎不一致
  - 照抄：写“计算期 32 年、运营期 29 年、后 19 年”等模板旧值
  sections:
  - id: CH-08-01
    number: '8.1'
    title: 盈利能力分析
    level: 2
    required: true
    templateHeading: true
    renderHeading: true
    templateHeadingText: 盈利能力分析
    goal: 导语 1 段：评价依据、计算期、口径（税后、折现率 3.50%）、本章结论
    audience:
    - 评审
    wordMin: 100
    requiredQuestions: []
    paragraphPlan:
